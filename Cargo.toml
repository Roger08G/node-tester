[workspace]
members = ["rust/engine", "rust/node-addon"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Roger08G/node-tester"

[workspace.dependencies]
command-group = "5"
dunce = "1"
napi = { version = "3.12", default-features = false, features = ["napi8"] }
napi-build = "2.4"
napi-derive = "3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
