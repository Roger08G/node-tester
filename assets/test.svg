<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title description">
  <title id="title">Salida de node-tester</title>
  <desc id="description">Ejemplo de una ejecución correcta con el motor Rust y Node.js</desc>
  <rect width="1120" height="260" rx="8" fill="#202536" />
  <rect x="18" y="18" width="1084" height="224" rx="6" fill="#171b27" stroke="#66708a" />

  <g font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="17">
    <text x="42" y="52" fill="#f4f6fb" font-weight="700">node-tester</text>
    <text x="42" y="80" fill="#aab3cc">motor Rust | Node.js 24.18.1</text>

    <line x1="42" y1="101" x2="1078" y2="101" stroke="#46506a" />

    <text x="42" y="136" fill="#8eea7b" font-weight="700">PASS</text>
    <text x="132" y="136" fill="#f4f6fb">adds numbers</text>
    <text x="1000" y="136" fill="#aab3cc">0.52 ms</text>
    <text x="132" y="168" fill="#aab3cc">test/fixtures/passing.test.mjs:5:3</text>

    <line x1="42" y1="190" x2="1078" y2="190" stroke="#46506a" />

    <text x="42" y="222" fill="#8eea7b" font-weight="700">PASS</text>
    <text x="132" y="222" fill="#f4f6fb">1 tests</text>
    <text x="260" y="222" fill="#aab3cc">|</text>
    <text x="286" y="222" fill="#8eea7b">1 passed</text>
    <text x="410" y="222" fill="#aab3cc">| 0 failed | 0 skipped | 0 todo | 56 ms</text>
  </g>
</svg>
