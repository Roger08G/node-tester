name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Install Rust security audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: bun run audit:rust

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Check Rust formatting and lints
        run: bun run check:rust

      - name: Test Rust workspace
        run: bun run test:rust

  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust target
        run: rustup toolchain install 1.98.0 --profile minimal --target ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native engine
        run: bunx napi build --platform --release --target ${{ matrix.target }} --manifest-path rust/node-addon/Cargo.toml --output-dir native --no-js --dts generated.d.ts -- --locked

      - name: Build TypeScript CLI
        run: bun run build:ts

      - name: Test with Node.js 24
        run: node --test test/*.test.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0

      - name: Test with minimum Node.js version
        run: node --test test/*.test.mjs

      - name: Upload native engine
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  package:
    name: Assemble package
    needs: [quality, native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download native engines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true

      - name: Verify release artifact set
        run: node scripts/check-release-artifacts.mjs

      - name: Build TypeScript CLI
        run: bun run build:ts

      - name: Create npm package and checksum
        shell: bash
        run: |
          npm pack --silent | tee pack-output.txt
          package="$(tail -n 1 pack-output.txt)"
          sha256sum "$package" > "$package.sha256"

      - name: Inspect package
        run: npm pack --dry-run

      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: |
            *.tgz
            *.tgz.sha256
          if-no-files-found: error

  publish:
    name: Publish production release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify tag and version
        run: node scripts/verify-release-tag.mjs

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: release

      - name: Verify checksum
        working-directory: release
        run: sha256sum --check *.tgz.sha256

      - name: Configure npm authentication
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npmrc="$RUNNER_TEMP/node-tester-npmrc"
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$npmrc"
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$npmrc"
          fi
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"

      - name: Check existing npm version
        id: npm-version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@rogergomezm/node-tester@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.npm-version.outputs.published != 'true'
        working-directory: release
        run: npm publish *.tgz --access public --provenance

      - name: Verify npm publication
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..10}; do
            published="$(npm view "@rogergomezm/node-tester@$version" version 2>/dev/null || true)"
            [[ "$published" == "$version" ]] && exit 0
            sleep 3
          done
          echo "npm did not expose @rogergomezm/node-tester@$version after publication" >&2
          exit 1

      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tgz release/*.tgz.sha256 --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Production ${GITHUB_REF_NAME#v}"
          else
            gh release create "$GITHUB_REF_NAME" release/*.tgz release/*.tgz.sha256 --verify-tag --generate-notes --title "Production ${GITHUB_REF_NAME#v}"
          fi

      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh release view "$GITHUB_REF_NAME" --json tagName --jq .tagName)"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name | select(endswith(".tgz") or endswith(".tgz.sha256"))] | length')"
          [[ "$tag" == "$GITHUB_REF_NAME" ]]
          [[ "$assets" -eq 2 ]]
