name: CI

on:
  push:
    branches: [main, "1.*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Install Rust security audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: bun run audit:rust

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Check Rust formatting and lints
        run: bun run check:rust

      - name: Test Rust workspace
        run: bun run test:rust

  msrv:
    name: MSRV (Rust 1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install minimum Rust version
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check minimum Rust version
        run: cargo +1.88.0 check --workspace --all-targets --locked

  native:
    name: ${{ matrix.target }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust target
        run: rustup toolchain install 1.98.0 --profile minimal --target ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native engine
        run: bunx napi build --platform --release --target ${{ matrix.target }} --manifest-path rust/node-addon/Cargo.toml --output-dir native --no-js --dts generated.d.ts -- --locked

      - name: Build TypeScript CLI
        run: bun run build:ts

      - name: Test with Node.js 24
        run: node --test test/*.test.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0

      - name: Test with minimum Node.js version
        run: node --test test/*.test.mjs

      - name: Smoke-test installed package
        shell: bash
        run: |
          package="$(npm pack --ignore-scripts --silent)"
          node scripts/smoke-package.mjs "$package"

      - name: Upload native engine
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  package:
    name: Assemble package
    needs: [quality, msrv, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download native engines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true

      - name: Verify release artifact set
        run: node scripts/check-release-artifacts.mjs

      - name: Build TypeScript CLI
        run: bun run build:ts

      - name: Create npm package and checksum
        shell: bash
        run: |
          npm pack --silent | tee pack-output.txt
          package="$(tail -n 1 pack-output.txt)"
          sha256sum "$package" > "$package.sha256"

      - name: Inspect package
        run: npm pack --dry-run

      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: |
            *.tgz
            *.tgz.sha256
          if-no-files-found: error

  installer:
    name: Build and test Windows installer
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: release

      - name: Build verified installer and run install/uninstall smoke test
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $package = Get-ChildItem release -Filter '*.tgz' | Select-Object -First 1
          ./scripts/build-windows-installer.ps1 -Version $version -PackagePath $package.FullName -OutputDirectory artifacts -SmokeTest

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish production release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify tag and version
        run: node scripts/verify-release-tag.mjs

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: release

      - name: Verify checksum
        working-directory: release
        run: sha256sum --check *.tgz.sha256

      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-installer
          path: release

      - name: Configure npm authentication
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          umask 077
          npmrc="$RUNNER_TEMP/node-tester-npmrc"
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$npmrc"
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$npmrc"
          fi
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"

      - name: Check existing npm version
        id: npm-version
        run: node scripts/verify-npm-publication.mjs --check release

      - name: Publish to npm with provenance
        if: steps.npm-version.outputs.published != 'true'
        working-directory: release
        run: npm publish *.tgz --access public --provenance --ignore-scripts

      - name: Verify npm publication
        run: node scripts/verify-npm-publication.mjs --verify release

      - name: Package source and checksums
        shell: bash
        run: |
          git archive --format=zip --prefix="node-tester-${GITHUB_REF_NAME}-source/" --output="release/node-tester-${GITHUB_REF_NAME}-source.zip" HEAD
          cd release
          sha256sum *.tgz *.zip *.exe > SHA256SUMS.txt

      - name: Create or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            node scripts/verify-release-assets.mjs release
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Production $GITHUB_REF_NAME" --latest
          fi

      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh release view "$GITHUB_REF_NAME" --json tagName --jq .tagName)"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name | select(endswith(".tgz") or endswith(".tgz.sha256"))] | length')"
          [[ "$tag" == "$GITHUB_REF_NAME" ]]
          [[ "$assets" -eq 2 ]]
          node scripts/verify-release-assets.mjs release

      - name: Remove temporary npm credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && "$NPM_CONFIG_USERCONFIG" == "$RUNNER_TEMP/node-tester-npmrc" ]]; then
            rm -f -- "$NPM_CONFIG_USERCONFIG"
          fi
